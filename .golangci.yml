version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - unconvert
    - prealloc
    - bodyclose
  settings:
    misspell:
      locale: US
      # Stored job/run status vocabulary (e.g. jobs.StatusCancelled).
      ignore-rules:
        - cancelled
        - cancelling
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
